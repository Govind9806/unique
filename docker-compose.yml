version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aproova_postgres
    environment:
      POSTGRES_DB: aproova_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aproova_backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/aproova_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgrespassword
      JWT_SECRET: 9a4f2c8d7b1e3f5a6b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
