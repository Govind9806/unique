spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    show-sql: ${JPA_SHOW_SQL}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL}
  flyway:
    enabled: ${FLYWAY_ENABLED}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE}
    locations: ${FLYWAY_LOCATIONS}

server:
  port: ${SERVER_PORT}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH}

springdoc:
  api-docs:
    path: ${SPRINGDOC_API_DOCS_PATH}
  swagger-ui:
    path: ${SPRINGDOC_SWAGGER_UI_PATH}
    operations-sorter: method
    tags-sorter: alpha












app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS}
  upload:
    dir: ${FILE_STORAGE_PATH}
  payment:
    provider: ${PAYMENT_PROVIDER}
    upi-merchant-vpa: ${UPI_MERCHANT_VPA}
    upi-merchant-name: ${UPI_MERCHANT_NAME}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET}
